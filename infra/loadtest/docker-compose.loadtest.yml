# Load-test topology: N API replicas and M workers behind an nginx load balancer, a mock model
# provider on the host (no provider tokens are spent) and isolated PostgreSQL/Redis volumes.
# Used by infra/loadtest/run.sh; not a production deployment.
#
#   API_REPLICAS=2 WORKER_REPLICAS=2 docker compose -p neuroflow-loadtest \
#     -f docker-compose.yml -f infra/loadtest/docker-compose.loadtest.yml --profile app up -d lb worker
services:
  postgres:
    # Only reachable from the host for seeding load-test tenants.
    ports: !override
      - "${LOADTEST_PG_PORT:-5434}:5432"
  redis:
    ports: !reset []

  api:
    ports: !reset []
    deploy:
      replicas: ${API_REPLICAS:-2}
    environment: &runtime
      NODE_ENV: production
      SESSION_SECRET: ${LOADTEST_SESSION_SECRET:?run infra/loadtest/run.sh}
      SECRETS_KEY: ${LOADTEST_SECRETS_KEY:?run infra/loadtest/run.sh}
      QWEN_BASE_URL: http://host.docker.internal:${MOCK_PORT:-11500}/v1
      QWEN_MODELS: qwen3:8b
      GROQ_API_KEY: ""
      MODEL_DEFAULT: qwen/qwen3:8b
      MODEL_FALLBACKS: ""
      MODEL_PROVIDER_LIMITS: ""
      MODEL_PROVIDER_CONCURRENCY: qwen=64
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      MAX_QUEUE_BACKLOG: "5000"
      # The load test measures capacity, not plan limits: per-minute run creation is not capped
      # (gateway-mode calls count as runs; 40 calls/s over 8 tenants exceeds the enterprise plan).
      RUN_RATE_LIMIT_PER_MINUTE: "${LOADTEST_RUN_RATE_LIMIT:-100000}"
      LOG_LEVEL: warn
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
      CODE_DATA_DIR: /tmp/neuroflow-code
    volumes: !reset []
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ready >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 40

  worker:
    deploy:
      replicas: ${WORKER_REPLICAS:-2}
    environment: *runtime
    volumes: !reset []

  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./infra/loadtest/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${LB_PORT:-8088}:80"
    depends_on:
      api: { condition: service_healthy }
    profiles: ["app"]
