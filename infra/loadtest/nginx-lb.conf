# L7 load balancer in front of N stateless API replicas (docker compose --scale api=N).
# Docker's DNS returns one address per replica; nginx resolves `api` at start-up and balances
# across all of them. SSE-friendly: no buffering, long read timeouts, HTTP/1.1 keep-alive upstream.
# One line per request with the replica that served it (counted by run.sh after each test).
log_format upstream '$upstream_addr';

upstream api_pool {
  least_conn;
  server api:8080 max_fails=3 fail_timeout=10s;
  keepalive 64;
}

server {
  listen 80;

  location / {
    access_log /var/log/nginx/upstream.log upstream;
    proxy_pass http://api_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    # Retry another replica when one is down (idempotent requests only, nginx default).
    proxy_next_upstream error timeout http_502 http_503;
    # Which replica served the request — used to verify the load is actually spread.
    add_header X-Served-By $upstream_addr always;
  }

  location = /lb-health {
    return 200 "ok\n";
  }
}
