name: neuroflow

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: neuroflow
      # Local infra defaults to a dev password; the containerised API refuses it (set POSTGRES_PASSWORD).
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-neuroflow}
      POSTGRES_DB: neuroflow
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U neuroflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      args:
        APP: api
    env_file: .env
    environment:
      DATABASE_URL: postgres://neuroflow:${POSTGRES_PASSWORD:-neuroflow}@postgres:5432/neuroflow
      REDIS_URL: redis://redis:6379
      QWEN_BASE_URL: ${QWEN_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
      HOST: 0.0.0.0
      PORT: "8080"
      SESSION_SECRET: ${SESSION_SECRET:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      # The containers run production builds: password accounts + API keys, no dev login/key.
      AUTH_MODE: production
      DEV_API_KEY: ""
      SECRETS_KEY: ${SECRETS_KEY:-}
      CODE_DATA_DIR: ${CODE_DATA_HOST_DIR:-/var/lib/neuroflow/code}
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:5173}
    volumes:
      # Same path inside and outside the container (see the worker).
      - ${CODE_DATA_HOST_DIR:-/var/lib/neuroflow/code}:${CODE_DATA_HOST_DIR:-/var/lib/neuroflow/code}
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: ["app"]

  worker:
    build:
      context: .
      dockerfile: infra/docker/node.Dockerfile
      args:
        APP: worker
    env_file: .env
    environment:
      DATABASE_URL: postgres://neuroflow:${POSTGRES_PASSWORD:-neuroflow}@postgres:5432/neuroflow
      REDIS_URL: redis://redis:6379
      QWEN_BASE_URL: ${QWEN_BASE_URL_DOCKER:-http://host.docker.internal:11434/v1}
      BCI_SERVICE_URL: http://bci:8000
      SECRETS_KEY: ${SECRETS_KEY:-}
      CODE_DATA_DIR: ${CODE_DATA_HOST_DIR:-/var/lib/neuroflow/code}
    volumes:
      # Agent commands run in sibling sandbox containers started through the host Docker daemon,
      # so repository checkouts live at an identical host/container path for the bind mounts.
      - ${CODE_DATA_HOST_DIR:-/var/lib/neuroflow/code}:${CODE_DATA_HOST_DIR:-/var/lib/neuroflow/code}
      - /var/run/docker.sock:/var/run/docker.sock
    # Group owning the Docker socket on the host (getent group docker).
    group_add:
      - "${DOCKER_GID:-999}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    stop_grace_period: 60s
    profiles: ["app"]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - api
    profiles: ["app"]

  # Optional EEG cognitive-state service (existing Python classifier), used by Cognitive Mode.
  bci:
    build:
      context: .
      dockerfile: infra/docker/bci.Dockerfile
    ports:
      - "8000:8000"
    profiles: ["bci"]

volumes:
  pgdata:
  redisdata:
